on:
  workflow_dispatch:
jobs:
    job_1:
        strategy: 
            fail-fast: false
            max-parallel: 3
            matrix: 
                os : [ubuntu-latest , windows-latest , macos-latest]
                node_version: [14.x, 15.x, 16.x]
       # the matrix is like the loop
        runs-on: ${{matrix.os}}
        steps:
            - uses: actions/setup-node@v3.6.0
              with: 
                node_version: ${{matrix.node_version}}