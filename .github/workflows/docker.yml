name: Hybrid Job

on:
  workflow_dispatch:

jobs:

  
  hybrid_job:
    runs-on: ubuntu-latest
    steps:
      - name: Run command in Ubuntu VM
        run: echo "This runs on Ubuntu VM"

      - name: Run inside the container
        uses: docker://alpine:3.14
        with:
          entrypoint: /bin/sh
          args: -c 'echo "Run inside the container"'

      - name: Run another command in Ubuntu VM
        run: echo "Back to VM"

  dockerized_job:
    runs-on: ubuntu-latest
    container:
      image: node:20              
      credentials:                
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Check Node version
        run: node --version

      - name: Confirm running inside container
        run: echo "This whole job runs inside the container"